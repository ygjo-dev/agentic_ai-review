# Builds the static viewer from the agentic_ai Review Source and publishes dist/
# to GitHub Pages. Only a dispatch deploys; viewer pushes and pull requests only build.
#
# What is shown is one pair of develop states, never a history:
#   review    Before = develop just before an update, After = develop just after it
#   baseline  Before = develop HEAD, no After (a dispatch without a pair)
# agentic_ai's Review Web workflow dispatches the pair from every develop push, and it
# stays published until the next develop update replaces it. A viewer change is
# published by the next dispatch (run this workflow by hand with the current pair).
name: Deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      before_sha:
        description: develop commit just before the update (empty with after_sha = baseline)
        required: false
        default: ''
      after_sha:
        description: develop commit just after the update (empty = baseline)
        required: false
        default: ''

permissions:
  contents: read

env:
  # Branch of ygjo-dev/agentic_ai whose updates are reviewed.
  AGENTIC_AI_REF: develop

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout agentic_ai-review
        uses: actions/checkout@v7
        with:
          path: agentic_ai-review
          persist-credentials: false

      # Full history: Before and After are read from develop's commits by SHA.
      - name: Checkout agentic_ai
        uses: actions/checkout@v7
        with:
          repository: ygjo-dev/agentic_ai
          ref: ${{ env.AGENTIC_AI_REF }}
          path: agentic_ai
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.AGENTIC_AI_READ_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agentic_ai-review/package-lock.json

      - name: Install
        working-directory: agentic_ai-review
        run: npm ci

      - name: Lint
        working-directory: agentic_ai-review
        run: npm run lint

      - name: Test
        working-directory: agentic_ai-review
        run: npm test

      # Inputs reach the script as environment variables only, never as shell text.
      - name: Resolve review context
        working-directory: agentic_ai-review
        env:
          AGENTIC_AI_REVIEW_SOURCE_ROOT: ${{ github.workspace }}/agentic_ai
          INPUT_BEFORE_SHA: ${{ inputs.before_sha }}
          INPUT_AFTER_SHA: ${{ inputs.after_sha }}
          INPUT_BRANCH: ${{ env.AGENTIC_AI_REF }}
        run: node scripts/resolve-review-context.mjs

      - name: Build
        working-directory: agentic_ai-review
        env:
          AGENTIC_AI_REVIEW_SOURCE_ROOT: ${{ github.workspace }}/agentic_ai
        run: npm run build

      # dist/ is public: refuse to publish anything that looks like a credential.
      - name: Scan dist for credentials
        working-directory: agentic_ai-review
        run: |
          test -f dist/index.html
          if grep -rEnI -o \
            -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' \
            -e 'gh[pousr]_[A-Za-z0-9]{36}' \
            -e 'github_pat_[A-Za-z0-9_]{22,}' \
            -e 'AKIA[0-9A-Z]{16}' \
            -e 'AIza[0-9A-Za-z_-]{35}' \
            -e 'xox[abprs]-[A-Za-z0-9-]{10,}' \
            -e '\bsk-(ant-|proj-)?[A-Za-z0-9_-]{20,}' \
            -e '\bhf_[A-Za-z0-9]{30,}' \
            -e 'eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.' \
            dist; then
            echo "::error::credential-like string in dist/"
            exit 1
          fi

      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: agentic_ai-review/dist

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # Once the pair is live. A Slack failure never undoes the deploy.
      - name: Notify Slack
        if: inputs.after_sha != ''
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BEFORE_SHA: ${{ inputs.before_sha }}
          AFTER_SHA: ${{ inputs.after_sha }}
          REVIEW_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "Slack skipped: SLACK_WEBHOOK_URL is not set"
            echo "### Slack: skipped (SLACK_WEBHOOK_URL not set)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          text=$(printf 'agentic_ai develop review ready\nBefore: %s · %s\nAfter: %s · %s\nReview: %s' \
            "$AGENTIC_AI_REF" "${BEFORE_SHA:0:7}" "$AGENTIC_AI_REF" "${AFTER_SHA:0:7}" "$REVIEW_URL")
          if ! jq -n --arg text "$text" '{text: $text}' | curl -fsS -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL"; then
            echo "::error::Slack notification failed"
            exit 1
          fi
          echo "### Slack: sent" >> "$GITHUB_STEP_SUMMARY"
