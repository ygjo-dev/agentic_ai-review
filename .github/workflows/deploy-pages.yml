# Builds the static viewer from the agentic_ai Review Source and publishes dist/
# to GitHub Pages. Pull requests only build; main pushes and dispatches deploy.
#
# What is shown is one review context, never a history:
#   baseline  Before = agentic_ai develop HEAD, no After
#   review    Before = fork point of the one review-ready PR, After = its head
# agentic_ai's Review Web workflow dispatches this with the pair for its PR event;
# a run without inputs (viewer push, manual run) looks the context up itself.
name: Deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Before commit (empty = look the review context up)
        required: false
        default: ''
      head_sha:
        description: After commit (empty = baseline only)
        required: false
        default: ''
      base_branch:
        description: Branch the review merges into
        required: false
        default: develop
      head_branch:
        description: Feature branch under review
        required: false
        default: ''
      pr_number:
        description: Pull request under review
        required: false
        default: ''

permissions:
  contents: read

env:
  # Branch of ygjo-dev/agentic_ai that reviews merge into (the baseline).
  AGENTIC_AI_REF: develop

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout agentic_ai-review
        uses: actions/checkout@v7
        with:
          path: agentic_ai-review
          persist-credentials: false

      # Full history: the fork point is merge-base(develop, PR head).
      - name: Checkout agentic_ai
        uses: actions/checkout@v7
        with:
          repository: ygjo-dev/agentic_ai
          ref: ${{ env.AGENTIC_AI_REF }}
          path: agentic_ai
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agentic_ai-review/package-lock.json

      - name: Install
        working-directory: agentic_ai-review
        run: npm ci

      - name: Lint
        working-directory: agentic_ai-review
        run: npm run lint

      # Inputs reach the script as environment variables only, never as shell text.
      - name: Resolve review context
        working-directory: agentic_ai-review
        env:
          AGENTIC_AI_REVIEW_SOURCE_ROOT: ${{ github.workspace }}/agentic_ai
          AGENTIC_REPO: ygjo-dev/agentic_ai
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          INPUT_BASE_BRANCH: ${{ inputs.base_branch || env.AGENTIC_AI_REF }}
          INPUT_HEAD_BRANCH: ${{ inputs.head_branch }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: node scripts/resolve-review-context.mjs

      - name: Build
        working-directory: agentic_ai-review
        env:
          AGENTIC_AI_REVIEW_SOURCE_ROOT: ${{ github.workspace }}/agentic_ai
        run: npm run build

      # dist/ is public: refuse to publish anything that looks like a credential.
      - name: Scan dist for credentials
        working-directory: agentic_ai-review
        run: |
          test -f dist/index.html
          if grep -rEnI -o \
            -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' \
            -e 'gh[pousr]_[A-Za-z0-9]{36}' \
            -e 'github_pat_[A-Za-z0-9_]{22,}' \
            -e 'AKIA[0-9A-Z]{16}' \
            -e 'AIza[0-9A-Za-z_-]{35}' \
            -e 'xox[abprs]-[A-Za-z0-9-]{10,}' \
            -e '\bsk-(ant-|proj-)?[A-Za-z0-9_-]{20,}' \
            -e '\bhf_[A-Za-z0-9]{30,}' \
            -e 'eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.' \
            dist; then
            echo "::error::credential-like string in dist/"
            exit 1
          fi

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: agentic_ai-review/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
